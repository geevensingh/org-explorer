name: Isolated Windows installer

on:
  pull_request:
    paths:
      - '.github/workflows/installer-verification.yml'
      - '.config/dotnet-tools.json'
      - 'eng/Package-Windows.ps1'
      - 'eng/Test-WindowsInstaller.ps1'
      - 'eng/New-UpdateTestFixture.ps1'
      - 'tests/ControlledUpdateEffects.cs'
      - 'tests/SignedReleaseFixture.cs'
      - 'tests/LocalReleaseServer.cs'
      - 'tests/Installer.*.Tests.ps1'
      - 'tests/OrgExplorer.Installer.Smoke/**'
      - 'tests/OrgExplorer.Installer.ProcessFixture/**'
      - 'tests/OrgExplorer.Core.Tests/UninstallProcessTests.cs'
      - 'tests/OrgExplorer.Desktop.Smoke/**'
      - 'src/**'
      - 'docs/INSTALLATION.md'
      - 'Directory.Build.props'
      - 'NuGet.Config'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Isolated Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Record actual hosted operating system
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Write-Host "Runner environment: $env:RUNNER_ENVIRONMENT; image: $env:ImageOS $env:ImageVersion"
          Write-Host 'A hosted Windows Server run does not certify Windows 11 client or Windows publisher trust.'
      - name: Verify deferred uninstall cleanup completion without installing
        run: |
          dotnet restore tests\OrgExplorer.Core.Tests --locked-mode
          dotnet test tests\OrgExplorer.Core.Tests -c Release --no-restore --filter FullyQualifiedName~UninstallProcessTests
      - name: Prepare ephemeral public trust and isolated external update transport
        run: |
          $fixture = Join-Path $env:GITHUB_WORKSPACE '.test-workspaces\installer-update-trust'
          "ORG_EXPLORER_UPDATE_FIXTURE=$fixture" >> $env:GITHUB_ENV
          .\eng\New-UpdateTestFixture.ps1 -Directory $fixture
      - name: Build two real runtime-included fixture installers
        run: |
          $trust = Join-Path $env:ORG_EXPLORER_UPDATE_FIXTURE 'trust.json'
          .\eng\Package-Windows.ps1 -Version 0.1.0 -UpdateTrustFile $trust -UpdateEffectsFile tests\ControlledUpdateEffects.cs
          .\eng\Package-Windows.ps1 -Version 0.1.1 -UpdateTrustFile $trust -UpdateEffectsFile tests\ControlledUpdateEffects.cs
          Copy-Item .artifacts\installer\0.1.1\releases\geevensingh.OrgExplorer-0.1.1-full.nupkg (Join-Path $env:ORG_EXPLORER_UPDATE_FIXTURE 'package.nupkg')
      - name: Verify fast lifecycle bootstrap without opening Workspace or WPF
        run: .\tests\Installer.Bootstrap.Tests.ps1 -Executable .artifacts\installer\0.1.0\publish\OrgExplorer.Desktop.exe
      - name: Install, start, upgrade, preserve Workspace, uninstall and reinstall
        run: .\eng\Test-WindowsInstaller.ps1 -Version 0.1.0 -UpgradeVersion 0.1.1 -Mode Hosted
      - name: Prove production trust and effects isolation
        run: |
          dotnet publish src\OrgExplorer.Desktop -c Release -o .artifacts\production-update-check
          .\tests\Update.Trust.Tests.ps1 -Assembly .artifacts\production-update-check\OrgExplorer.Desktop.dll -Configuration src\OrgExplorer.Desktop\update-trust.json
      - name: Remove ephemeral signing material
        if: ${{ always() }}
        run: |
          if ($env:ORG_EXPLORER_UPDATE_FIXTURE -and (Test-Path $env:ORG_EXPLORER_UPDATE_FIXTURE)) {
            Remove-Item -LiteralPath $env:ORG_EXPLORER_UPDATE_FIXTURE -Recurse -Force
          }
      - name: Report lifecycle outcome and coverage limits
        if: ${{ always() }}
        run: |
          $path = '.artifacts\installer-verification\0.1.0-to-0.1.1\results\result.json'
          if (Test-Path $path) {
            $result = Get-Content $path -Raw | ConvertFrom-Json
            "## Isolated installer lifecycle: $($result.result)`nOS: $($result.os.description); product: $($result.os.productName); build: $($result.os.build).`nWindows 11 client run: $($result.os.windows11Client).`n$($result.os.coverageLimit)`n$($result.trustLimitations)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            '## Installer verification did not complete; no passed lifecycle result exists.' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: isolated-installer-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            .artifacts/installer-verification/0.1.0-to-0.1.1/results/result.json
            .artifacts/installer-verification/0.1.0-to-0.1.1/results/*.log
            .artifacts/installer-verification/0.1.0-to-0.1.1/results/*.stdout.txt
            .artifacts/installer-verification/0.1.0-to-0.1.1/results/*.stderr.txt
            .artifacts/installer/0.1.0/releases/package-metadata.json
            .artifacts/installer/0.1.1/releases/package-metadata.json
