name: Independent complete performance sample

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      sample:
        required: true
        type: number

permissions:
  contents: read

jobs:
  non-ui:
    name: Non-UI cohort sample (${{ inputs.sample }})
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - name: Start whole-execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run this sample's complete named non-UI execution
        env:
          REVISION: ${{ inputs.revision }}
          SAMPLE: ${{ inputs.sample }}
        run: .\eng\Run-Performance.ps1 -ExpectedRevision $env:REVISION -CohortId "$env:REVISION-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Sample ([int]$env:SAMPLE)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: non-ui-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/performance/**/*.json
            .ci-results/performance/**/*.log
            .ci-results/performance/**/*.trx

  prefix:
    name: Rich cohort prefix (${{ inputs.sample }})
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - name: Start whole-execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run original rich prefix and capture its actual logical snapshot
        env:
          REVISION: ${{ inputs.revision }}
          SAMPLE: ${{ inputs.sample }}
        run: .\eng\Run-UiScale.ps1 -ExpectedRevision $env:REVISION -Worker prefix -ResultsDirectory .ci-results\prefix -CohortId "$env:REVISION-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Sample ([int]$env:SAMPLE)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rich-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}-prefix
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/prefix/**/*.json
            .ci-results/prefix/**/*.log
            .ci-results/prefix/**/*.oesnapshot
            .ci-results/prefix/**/*.png

  tail:
    name: Rich cohort tail (${{ inputs.sample }})
    needs: prefix
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - name: Start whole-execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/download-artifact@v4
        with:
          name: rich-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}-prefix
          path: .ci-results/prefix
      - name: Public Join and original tail using only this sample's actual prefix
        env:
          REVISION: ${{ inputs.revision }}
          SAMPLE: ${{ inputs.sample }}
        run: .\eng\Run-UiScale.ps1 -ExpectedRevision $env:REVISION -Worker tail -PrefixResultsDirectory .ci-results\prefix -ResultsDirectory .ci-results\tail -CohortId "$env:REVISION-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Sample ([int]$env:SAMPLE)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rich-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}-tail
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/tail/**/*.json
            .ci-results/tail/**/*.log
            .ci-results/tail/**/*.png

  union:
    name: Rich cohort union (${{ inputs.sample }})
    needs: [non-ui, prefix, tail]
    if: ${{ always() }}
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: rich-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}-prefix
          path: .ci-results/prefix
      - uses: actions/download-artifact@v4
        with:
          name: rich-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}-tail
          path: .ci-results/tail
      - name: Require every original accepting worker, phase and exact handoff
        if: ${{ always() }}
        env:
          REVISION: ${{ inputs.revision }}
          SAMPLE: ${{ inputs.sample }}
          NON_UI_OUTCOME: ${{ needs.non-ui.result }}
          PREFIX_OUTCOME: ${{ needs.prefix.result }}
          TAIL_OUTCOME: ${{ needs.tail.result }}
        run: .\eng\Assert-UiScaleUnion.ps1 -PrefixDirectory .ci-results\prefix -TailDirectory .ci-results\tail -ExpectedRevision $env:REVISION -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -RequiredJobOutcomes @($env:NON_UI_OUTCOME, $env:PREFIX_OUTCOME, $env:TAIL_OUTCOME) -ResultsDirectory .ci-results\union -CohortId "$env:REVISION-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" -Sample ([int]$env:SAMPLE)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rich-cohort-${{ inputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}-sample-${{ inputs.sample }}-union
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/union/**/*.json
            .ci-results/union/**/*.log
            .ci-results/union/**/*.oesnapshot
            .ci-results/union/**/*.png
