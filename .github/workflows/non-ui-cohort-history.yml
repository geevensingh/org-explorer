name: Non-UI cohort history

on:
  workflow_run:
    workflows: [Non-UI performance cohorts, Performance scale cohorts]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  history:
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Retain complete, failed and interrupted cohort attempts
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVED_RUN: ${{ github.event.workflow_run.id }}
          OBSERVED_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          .\eng\Invoke-NonUiCohortObservation.ps1 -RunId ([long]$env:OBSERVED_RUN) -RunAttempt ([int]$env:OBSERVED_ATTEMPT) -WorkingDirectory .ci-results\cohort-history -ApprovedPolicyVersion ci-timing-v3
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: non-ui-cohort-history-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          retention-days: 30
          path: |
            .ci-results/cohort-history/**/*.json
            .ci-results/cohort-history/**/*.md
