name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_scale_verification:
        description: Run separate scale verification at this dispatch commit
        required: false
        default: false
        type: boolean
      run_release_verification:
        description: Rehearse a product release with test keys; never publish
        required: false
        default: false
        type: boolean
      sqlite_native_trace_stage2:
        description: Same-source isolated native diagnostic; strict original case only, NOT CI acceptance
        required: false
        default: false
        type: boolean
      sqlite_native_stage2_variant:
        description: Matched same-source native variant, never the clean shipping candidate
        required: false
        default: diagnostic
        type: choice
        options: [diagnostic, control]

permissions:
  contents: read

jobs:
  core:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sqlite_native_trace_stage2 }}
    name: Core and view models
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 core
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: core-timings
          path: |
            .ci-results/core/*.json
            .ci-results/core/*.log
            .ci-results/core/*.trx

  filesystem:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sqlite_native_trace_stage2 }}
    name: Real filesystem persistence
    runs-on: windows-latest
    timeout-minutes: 11
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 filesystem
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: filesystem-timings
          path: |
            .ci-results/filesystem/*.json
            .ci-results/filesystem/*.log
            .ci-results/filesystem/*.trx

  desktop:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sqlite_native_trace_stage2 }}
    name: Actual Windows desktop smoke (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [people, workspace]
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 desktop -DesktopPartition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: |
            .ci-results/desktop-${{ matrix.partition }}/*.json
            .ci-results/desktop-${{ matrix.partition }}/*.log
            .ci-results/desktop-${{ matrix.partition }}/*.png

  high-resolution:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.sqlite_native_trace_stage2 }}
    name: High-resolution Windows smoke (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [reading, context]
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 high-resolution -HighResolutionPartition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: high-resolution-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: |
            .ci-results/high-resolution-${{ matrix.partition }}/*.json
            .ci-results/high-resolution-${{ matrix.partition }}/*.log
            .ci-results/high-resolution-${{ matrix.partition }}/*.png

  ci:
    name: CI
    if: ${{ always() }}
    needs: [core, filesystem, desktop, high-resolution]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-attempt-${{ github.run_attempt }}
          path: .ci-results/desktop-collection
      - uses: actions/download-artifact@v4
        with:
          pattern: high-resolution-*-attempt-${{ github.run_attempt }}
          path: .ci-results/high-resolution-collection
      - name: Require every test lane to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          HIGH_RESOLUTION_RESULT: ${{ needs.high-resolution.result }}
        run: |
          . .\eng\CiGate.ps1
          Assert-CiResults @($env:CORE_RESULT, $env:FILESYSTEM_RESULT, $env:DESKTOP_RESULT, $env:HIGH_RESOLUTION_RESULT)
          . .\eng\DesktopResults.ps1
          Assert-DesktopPartitions -Path .ci-results\desktop-collection -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          Assert-DesktopPartitions -Path .ci-results\high-resolution-collection -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -HighResolution

  scale-verification:
    name: Optional manual scale verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale_verification && !inputs.run_release_verification && !inputs.sqlite_native_trace_stage2 }}
    uses: ./.github/workflows/scale-verification.yml
    with:
      revision: ${{ github.sha }}

  release-verification:
    name: Optional product release rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_verification && !inputs.sqlite_native_trace_stage2 }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-verification.yml
    with:
      revision: ${{ github.sha }}
  sqlite-native-stage2:
    name: SQLite same-source native diagnostic (NOT CI)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sqlite_native_trace_stage2 }}
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build matched native variants and run the original strict retained-WAL case once
        run: .\eng\Run-SqliteNativeStage2.ps1 -BuildNative -NativeManifest .ci-results\sqlite-native-stage2\native\native-build.json -Variant ${{ inputs.sqlite_native_stage2_variant }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: diagnostic-sqlite-stage2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .ci-results/sqlite-native-stage2/**/*.json
            .ci-results/sqlite-native-stage2/*.trx
            .ci-results/sqlite-native-stage2/*.log
            .ci-results/sqlite-native-stage2/native/*.c
            .ci-results/sqlite-native-stage2/native/*.h
            .ci-results/sqlite-native-stage2/native/*.patch
            .ci-results/sqlite-native-stage2/native/*.dll
            .ci-results/sqlite-native-stage2/native/*.log
