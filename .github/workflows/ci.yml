name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_scale_verification:
        description: Run separate scale verification at this dispatch commit
        required: false
        default: false
        type: boolean
      run_release_verification:
        description: Rehearse a product release with test keys; never publish
        required: false
        default: false
        type: boolean
      run_tree_diagnosis:
        description: Diagnose the unchanged native scale tree; not release approval
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  tree-diagnosis:
    name: Diagnostic native scale tree
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tree_diagnosis }}
    runs-on: windows-latest
    timeout-minutes: 13
    steps:
      - name: Start diagnostic execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run the original tree journey under the unchanged budget
        run: |
          . .\eng\ScaleRunner.ps1
          . .\eng\DesktopResults.ps1
          . .\eng\UiScaleResults.ps1
          $selection = @{ diagnosticOnly = $true; requiredScenarios = @('scale-navigation-rendering') }
          Invoke-ScaleSuite -Suite tree-diagnostic -Label 'Diagnostic native tree' `
            -ResultsDirectory .ci-results\tree-diagnostic -ExpectedRevision $env:GITHUB_SHA `
            -Selection $selection -Verify {
              param($run, $build)
              $previous = $env:DESKTOP_RESULTS_DIRECTORY
              try {
                $env:DESKTOP_RESULTS_DIRECTORY = $run
                Invoke-ScaleDotnet restore-app @('restore', 'src\OrgExplorer.Desktop', '--locked-mode')
                Invoke-ScaleDotnet restore-tests @('restore', 'tests\OrgExplorer.Desktop.Smoke', '--locked-mode')
                Invoke-ScaleDotnet build-app @('build', 'src\OrgExplorer.Desktop', '-c', 'Release', '--no-restore')
                Invoke-ScaleDotnet display @('run', '--project', 'tests\OrgExplorer.Desktop.Smoke', '-c', 'Release',
                  '--no-restore', '--', '--prepare-high-resolution')
                Invoke-ScaleDotnet tree @('run', '--project', 'tests\OrgExplorer.Desktop.Smoke', '-c', 'Release',
                  '--no-build', '--no-restore', '--',
                  (Join-Path $build 'bin\OrgExplorer.Desktop\release\OrgExplorer.Desktop.exe'), 'scale-navigation-rendering')
                Assert-DesktopResults (Join-Path $run 'scenarios.json') @('scale-navigation-rendering')
              } finally { $env:DESKTOP_RESULTS_DIRECTORY = $previous }
            }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: diagnostic-tree-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .ci-results/tree-diagnostic/**/*.json
            .ci-results/tree-diagnostic/**/*.log
            .ci-results/tree-diagnostic/**/*.png

  core:
    name: Core and view models
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 core
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: core-timings
          path: |
            .ci-results/core/*.json
            .ci-results/core/*.log
            .ci-results/core/*.trx

  filesystem:
    name: Real filesystem persistence
    runs-on: windows-latest
    timeout-minutes: 11
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 filesystem
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: filesystem-timings
          path: |
            .ci-results/filesystem/*.json
            .ci-results/filesystem/*.log
            .ci-results/filesystem/*.trx

  desktop:
    name: Actual Windows desktop smoke (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [people, workspace]
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 desktop -DesktopPartition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: |
            .ci-results/desktop-${{ matrix.partition }}/*.json
            .ci-results/desktop-${{ matrix.partition }}/*.log
            .ci-results/desktop-${{ matrix.partition }}/*.png

  high-resolution:
    name: High-resolution Windows smoke (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [reading, context]
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 high-resolution -HighResolutionPartition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: high-resolution-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          path: |
            .ci-results/high-resolution-${{ matrix.partition }}/*.json
            .ci-results/high-resolution-${{ matrix.partition }}/*.log
            .ci-results/high-resolution-${{ matrix.partition }}/*.png

  ci:
    name: CI
    if: ${{ always() }}
    needs: [core, filesystem, desktop, high-resolution]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-attempt-${{ github.run_attempt }}
          path: .ci-results/desktop-collection
      - uses: actions/download-artifact@v4
        with:
          pattern: high-resolution-*-attempt-${{ github.run_attempt }}
          path: .ci-results/high-resolution-collection
      - name: Require every test lane to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          HIGH_RESOLUTION_RESULT: ${{ needs.high-resolution.result }}
        run: |
          . .\eng\CiGate.ps1
          Assert-CiResults @($env:CORE_RESULT, $env:FILESYSTEM_RESULT, $env:DESKTOP_RESULT, $env:HIGH_RESOLUTION_RESULT)
          . .\eng\DesktopResults.ps1
          Assert-DesktopPartitions -Path .ci-results\desktop-collection -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          Assert-DesktopPartitions -Path .ci-results\high-resolution-collection -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -HighResolution

  scale-verification:
    name: Optional manual scale verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale_verification && !inputs.run_release_verification }}
    uses: ./.github/workflows/scale-verification.yml
    with:
      revision: ${{ github.sha }}

  release-verification:
    name: Optional product release rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_verification }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-verification.yml
    with:
      revision: ${{ github.sha }}
