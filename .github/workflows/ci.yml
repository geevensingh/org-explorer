name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_scale_verification:
        description: Run separate scale verification at this dispatch commit
        required: false
        default: false
        type: boolean
      run_release_verification:
        description: Rehearse a product release with test keys; never publish
        required: false
        default: false
        type: boolean
      run_uia_observation_probe:
        description: Diagnostic-only native query comparison; not smoke acceptance
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  core:
    name: Core and view models
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 core
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: core-timings
          path: |
            .ci-results/core/*.json
            .ci-results/core/*.log
            .ci-results/core/*.trx

  filesystem:
    name: Real filesystem persistence
    runs-on: windows-latest
    timeout-minutes: 11
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 filesystem
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: filesystem-timings
          path: |
            .ci-results/filesystem/*.json
            .ci-results/filesystem/*.log
            .ci-results/filesystem/*.trx

  desktop:
    name: Actual Windows desktop smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 desktop
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-timings
          path: |
            .ci-results/desktop/*.json
            .ci-results/desktop/*.log
            .ci-results/desktop/*.png

  high-resolution:
    name: High-resolution Windows smoke
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 high-resolution
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: high-resolution-timings
          path: |
            .ci-results/high-resolution/*.json
            .ci-results/high-resolution/*.log
            .ci-results/high-resolution/*.png

  ci:
    name: CI
    if: ${{ always() }}
    needs: [core, filesystem, desktop, high-resolution]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require every test lane to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          HIGH_RESOLUTION_RESULT: ${{ needs.high-resolution.result }}
        run: |
          . .\eng\CiGate.ps1
          Assert-CiResults @($env:CORE_RESULT, $env:FILESYSTEM_RESULT, $env:DESKTOP_RESULT, $env:HIGH_RESOLUTION_RESULT)

  scale-verification:
    name: Optional manual scale verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scale_verification && !inputs.run_release_verification }}
    uses: ./.github/workflows/scale-verification.yml
    with:
      revision: ${{ github.sha }}

  uia-observation-probe:
    name: Optional diagnostic native observation probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_uia_observation_probe }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      DESKTOP_RESULTS_DIRECTORY: ${{ github.workspace }}\.ci-results\uia-observation-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore src\OrgExplorer.Desktop --locked-mode
      - run: dotnet restore tests\OrgExplorer.Desktop.Smoke --locked-mode
      - run: dotnet build src\OrgExplorer.Desktop -c Release --no-restore
      - run: dotnet build tests\OrgExplorer.Desktop.Smoke -c Release --no-restore
      - name: Compare fresh native observations on isolated fictitious state
        run: |
          New-Item -ItemType Directory -Force $env:DESKTOP_RESULTS_DIRECTORY | Out-Null
          dotnet run --project tests\OrgExplorer.Desktop.Smoke -c Release --no-build -- src\OrgExplorer.Desktop\bin\Release\net10.0-windows\OrgExplorer.Desktop.exe --diagnose-uia-observation *> "$env:DESKTOP_RESULTS_DIRECTORY\probe.log"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: diagnostic-uia-observation
          path: .ci-results/uia-observation-probe/*
          if-no-files-found: error

  release-verification:
    name: Optional product release rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_release_verification }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-verification.yml
    with:
      revision: ${{ github.sha }}
