name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core and view models
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests\OrgExplorer.Core.Tests --locked-mode
      - run: dotnet test tests\OrgExplorer.Core.Tests -c Release --no-restore --logger trx
      - run: .\tests\CiGate.Tests.ps1

  filesystem:
    name: Real filesystem persistence
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests\OrgExplorer.Persistence.Tests --locked-mode
      - run: dotnet test tests\OrgExplorer.Persistence.Tests -c Release --no-restore --logger trx

  desktop:
    name: Actual Windows desktop smoke
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore src\OrgExplorer.Desktop --locked-mode
      - run: dotnet restore tests\OrgExplorer.Desktop.Smoke --locked-mode
      - run: dotnet build src\OrgExplorer.Desktop -c Release --no-restore
      - run: dotnet run --project tests\OrgExplorer.Desktop.Smoke -c Release --no-restore -- src\OrgExplorer.Desktop\bin\Release\net10.0-windows\OrgExplorer.Desktop.exe
      - name: Verify self-contained installer artifacts and real packaged desktop
        run: |
          .\eng\Package-Windows.ps1 -Version 0.1.0
          .\eng\Package-Windows.ps1 -Version 0.1.1
          .\eng\Test-WindowsInstaller.ps1 -Version 0.1.0 -PrepareOnly
          $payload = Get-ChildItem .artifacts\installer-verification -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          .\tests\Installer.PackagedDesktop.Tests.ps1 -ReleaseDirectory .artifacts\installer\0.1.0\releases -NewerReleaseDirectory .artifacts\installer\0.1.1\releases -SmokeRunner (Join-Path $payload.FullName 'smoke-input\OrgExplorer.Desktop.Smoke.exe')
          .\tests\Installer.Bootstrap.Tests.ps1 -Executable .artifacts\installer\0.1.0\publish\OrgExplorer.Desktop.exe
          .\tests\Installer.Isolation.Tests.ps1 -Harness (Join-Path $payload.FullName 'test-input\OrgExplorer.Installer.Smoke.exe')

  ci:
    name: CI
    if: ${{ always() }}
    needs: [core, filesystem, desktop]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Require every test lane to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          . .\eng\CiGate.ps1
          Assert-CiResults @($env:CORE_RESULT, $env:FILESYSTEM_RESULT, $env:DESKTOP_RESULT)
