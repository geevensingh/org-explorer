name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      core_capacity_diagnostic:
        description: Nonaccepting complete core calibration; retain 300s goal, no native lanes or release
        required: false
        default: false
        type: boolean
      run_scale_verification:
        description: Run separate scale verification at this dispatch commit
        required: false
        default: false
        type: boolean
      run_release_verification:
        description: Rehearse a product release with test keys; never publish
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  core:
    if: ${{ !inputs.core_capacity_diagnostic }}
    name: Core and view models
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 core
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: core-attempt-${{ github.run_attempt }}
          retention-days: 30
          path: |
            .ci-results/core/*.json
            .ci-results/core/*.log
            .ci-results/core/*.trx

  filesystem:
    if: ${{ !inputs.core_capacity_diagnostic }}
    name: Real filesystem persistence
    runs-on: windows-latest
    timeout-minutes: 11
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 filesystem
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: filesystem-attempt-${{ github.run_attempt }}
          retention-days: 30
          path: |
            .ci-results/filesystem/*.json
            .ci-results/filesystem/*.log
            .ci-results/filesystem/*.trx

  desktop:
    if: ${{ !inputs.core_capacity_diagnostic }}
    name: Actual Windows desktop smoke (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [people, workspace]
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 desktop -DesktopPartition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: desktop-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          path: |
            .ci-results/desktop-${{ matrix.partition }}/*.json
            .ci-results/desktop-${{ matrix.partition }}/*.log
            .ci-results/desktop-${{ matrix.partition }}/*.png

  high-resolution:
    if: ${{ !inputs.core_capacity_diagnostic }}
    name: High-resolution Windows smoke (${{ matrix.partition }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [reading, context]
    steps:
      - name: Start execution budget before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: .\eng\Run-CiLane.ps1 high-resolution -HighResolutionPartition ${{ matrix.partition }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: high-resolution-${{ matrix.partition }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          path: |
            .ci-results/high-resolution-${{ matrix.partition }}/*.json
            .ci-results/high-resolution-${{ matrix.partition }}/*.log
            .ci-results/high-resolution-${{ matrix.partition }}/*.png

  ci:
    name: CI
    if: ${{ always() && !inputs.core_capacity_diagnostic }}
    needs: [core, filesystem, desktop, high-resolution]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-attempt-${{ github.run_attempt }}
          path: .ci-results/desktop-collection
      - uses: actions/download-artifact@v4
        with:
          pattern: high-resolution-*-attempt-${{ github.run_attempt }}
          path: .ci-results/high-resolution-collection
      - name: Require every test lane to succeed
        env:
          CORE_RESULT: ${{ needs.core.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          HIGH_RESOLUTION_RESULT: ${{ needs.high-resolution.result }}
        run: |
          . .\eng\CiGate.ps1
          Assert-CiResults @($env:CORE_RESULT, $env:FILESYSTEM_RESULT, $env:DESKTOP_RESULT, $env:HIGH_RESOLUTION_RESULT)
          . .\eng\DesktopResults.ps1
          Assert-DesktopPartitions -Path .ci-results\desktop-collection -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          Assert-DesktopPartitions -Path .ci-results\high-resolution-collection -Revision $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -HighResolution

  scale-verification:
    name: Optional manual scale verification
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.core_capacity_diagnostic && inputs.run_scale_verification && !inputs.run_release_verification }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/scale-verification.yml
    with:
      revision: ${{ github.sha }}

  release-verification:
    name: Optional product release rehearsal
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.core_capacity_diagnostic && inputs.run_release_verification }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-verification.yml
    with:
      revision: ${{ github.sha }}

  core-capacity:
    name: Nonaccepting core capacity calibration (${{ matrix.sample }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.core_capacity_diagnostic }}
    runs-on: windows-latest
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        sample: [1, 2, 3]
    steps:
      - name: Start bounded diagnostic observation before setup
        run: '"LANE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Observe original compiled selection and all required companions
        run: .\eng\Run-CiLane.ps1 core -CoreCapacityDiagnostic
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: core-capacity-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.sample }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/core-capacity/*.json
            .ci-results/core-capacity/*.log
            .ci-results/core-capacity/*.trx
