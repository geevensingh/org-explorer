name: Scale verification

on:
  workflow_call:
    inputs:
      revision:
        description: Exact candidate commit supplied by the calling workflow
        required: true
        type: string
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character candidate SHA to check freshly (blank uses the selected workflow commit)
        required: false
        type: string

permissions:
  contents: read

jobs:
  non-ui-performance:
    name: Thorough non-UI performance
    runs-on: windows-latest
    timeout-minutes: 11
    env:
      CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - name: Start shared execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify the exact checked-out candidate
        run: |
          $revision = git rev-parse HEAD
          if ($env:CANDIDATE_REVISION -notmatch '^[0-9a-fA-F]{40}$' -or $revision -ne $env:CANDIDATE_REVISION) {
            throw 'Scale verification requires the exact full candidate SHA, not a mutable ref.'
          }
          "TESTED_REVISION=$revision" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run fresh complete non-UI performance verification
        run: .\eng\Run-Performance.ps1 -ExpectedRevision $env:TESTED_REVISION
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: non-ui-performance-${{ env.TESTED_REVISION || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .ci-results/performance/**/*.json
            .ci-results/performance/**/*.log
            .ci-results/performance/**/*.trx

  ui-scale:
    name: Genuine 10,000-Person WPF scale
    runs-on: windows-latest
    timeout-minutes: 11
    env:
      CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - name: Start shared execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify the exact checked-out candidate
        run: |
          $revision = git rev-parse HEAD
          if ($env:CANDIDATE_REVISION -notmatch '^[0-9a-fA-F]{40}$' -or $revision -ne $env:CANDIDATE_REVISION) {
            throw 'Scale verification requires the exact full candidate SHA, not a mutable ref.'
          }
          "TESTED_REVISION=$revision" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run fresh sequential genuine UI-scale scenarios
        run: .\eng\Run-UiScale.ps1 -ExpectedRevision $env:TESTED_REVISION
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ui-scale-${{ env.TESTED_REVISION || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            .ci-results/ui-scale/**/*.json
            .ci-results/ui-scale/**/*.log
