name: Scale verification

on:
  workflow_call:
    inputs:
      revision:
        description: Exact candidate commit supplied by the calling workflow
        required: true
        type: string
      extended_observation:
        description: Diagnostic UI observation only; never passing candidate verification
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      prefix_only_diagnostic:
        description: One prefix-only 900s observation, 30m watchdog; nonaccepting and baseline-ineligible
        required: false
        default: false
        type: boolean
      non_ui_cohort_pilot:
        description: Read-only three-worker NON-UI cohort pilot; no rich UI or publication
        required: false
        default: false
        type: boolean
      rich_cohort_pilot:
        description: Read-only three complete non-UI and rich prefix/tail/union samples; no publication
        required: false
        default: false
        type: boolean
      cohort_ci_run_id:
        description: Exact successful main-push required CI anchoring the non-promoting pilot
        required: false
        type: string
      cohort_ci_run_attempt:
        description: Exact required CI attempt anchoring the pilot
        required: false
        default: '1'
        type: string
      revision:
        description: Full 40-character candidate SHA to check freshly (blank uses the selected workflow commit)
        required: false
        type: string
      extended_observation:
        description: Explicit nonaccepting UI observation; cannot supply release proof or a baseline
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  non-ui-cohort-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.prefix_only_diagnostic && (inputs.non_ui_cohort_pilot || inputs.rich_cohort_pilot) }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/non-ui-cohort-execution.yml
    with:
      revision: ${{ github.sha }}
      ci_run_id: ${{ inputs.cohort_ci_run_id }}
      ci_run_attempt: ${{ inputs.cohort_ci_run_attempt }}
      pilot: true
      rich_scale: ${{ inputs.rich_cohort_pilot || false }}

  non-ui-performance:
    if: ${{ !inputs.prefix_only_diagnostic && !inputs.non_ui_cohort_pilot && !inputs.rich_cohort_pilot }}
    name: Thorough non-UI performance
    runs-on: windows-latest
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
    steps:
      - name: Start shared execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify the exact checked-out candidate
        run: |
          $revision = git rev-parse HEAD
          if ($env:CANDIDATE_REVISION -notmatch '^[0-9a-fA-F]{40}$' -or $revision -ne $env:CANDIDATE_REVISION) {
            throw 'Scale verification requires the exact full candidate SHA, not a mutable ref.'
          }
          "TESTED_REVISION=$revision" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run fresh complete non-UI performance verification
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path .\eng\Invoke-ScaleWorker.ps1) {
            .\eng\Invoke-ScaleWorker.ps1 -Stage Start -Worker non-ui-performance -ExpectedRevision $env:TESTED_REVISION -ResultsDirectory .ci-results\performance
          } else {
            .\eng\Run-Performance.ps1 -ExpectedRevision $env:TESTED_REVISION
          }
      - uses: actions/attest@v4
        id: cleanup-attestation
        if: ${{ steps.runner.outputs.needs_cleanup_signature == 'true' }}
        with:
          subject-path: ${{ steps.runner.outputs.cleanup_proof }}
      - name: Observe original non-UI completion
        if: ${{ steps.runner.outcome == 'success' }}
        env:
          ATTESTATION_BUNDLE: ${{ steps.cleanup-attestation.outputs.bundle-path }}
        run: |
          if (Test-Path .\eng\Invoke-ScaleWorker.ps1) {
            .\eng\Invoke-ScaleWorker.ps1 -Stage Complete -Worker non-ui-performance -ExpectedRevision $env:TESTED_REVISION -ResultsDirectory .ci-results\performance -AttestationBundle $env:ATTESTATION_BUNDLE
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: non-ui-performance-${{ env.TESTED_REVISION || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/performance/**/*.json
            .ci-results/performance/**/*.log
            .ci-results/performance/**/*.trx
            !.ci-results/performance/**/build/**

  ui-scale-prefix:
    if: ${{ inputs.prefix_only_diagnostic || (!inputs.non_ui_cohort_pilot && !inputs.rich_cohort_pilot) }}
    name: Rich combined normal and held-export saves
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
      EXTENDED_OBSERVATION: ${{ inputs.prefix_only_diagnostic || inputs.extended_observation || false }}
      PREFIX_ONLY_DIAGNOSTIC: ${{ inputs.prefix_only_diagnostic || false }}
    steps:
      - name: Start shared execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify the exact checked-out candidate
        run: |
          $revision = git rev-parse HEAD
          if ($env:CANDIDATE_REVISION -notmatch '^[0-9a-fA-F]{40}$' -or $revision -ne $env:CANDIDATE_REVISION) {
            throw 'Scale verification requires the exact full candidate SHA, not a mutable ref.'
          }
          if ($env:PREFIX_ONLY_DIAGNOSTIC -eq 'true' -and $revision -ne $env:GITHUB_SHA) {
            throw 'The prefix-only diagnostic must test the immutable workflow source, not another revision.'
          }
          "TESTED_REVISION=$revision" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Run combined rich save proof and capture actual published logical handoff
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path .\eng\Invoke-ScaleWorker.ps1) {
            .\eng\Invoke-ScaleWorker.ps1 -Stage Start -Worker prefix -ExpectedRevision $env:TESTED_REVISION -ResultsDirectory .ci-results\ui-scale-prefix -ExtendedObservation:([bool]::Parse($env:EXTENDED_OBSERVATION))
          } else {
            .\eng\Run-UiScale.ps1 -ExpectedRevision $env:TESTED_REVISION -Worker prefix -ResultsDirectory .ci-results\ui-scale-prefix -ExtendedObservation:([bool]::Parse($env:EXTENDED_OBSERVATION))
          }
      - uses: actions/attest@v4
        id: cleanup-attestation
        if: ${{ steps.runner.outputs.needs_cleanup_signature == 'true' }}
        with:
          subject-path: ${{ steps.runner.outputs.cleanup_proof }}
      - name: Observe original prefix completion
        if: ${{ steps.runner.outcome == 'success' }}
        env:
          ATTESTATION_BUNDLE: ${{ steps.cleanup-attestation.outputs.bundle-path }}
        run: |
          if (Test-Path .\eng\Invoke-ScaleWorker.ps1) {
            .\eng\Invoke-ScaleWorker.ps1 -Stage Complete -Worker prefix -ExpectedRevision $env:TESTED_REVISION -ResultsDirectory .ci-results\ui-scale-prefix -AttestationBundle $env:ATTESTATION_BUNDLE
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ (inputs.prefix_only_diagnostic || inputs.extended_observation) && 'diagnostic-' || '' }}ui-scale-prefix-${{ env.TESTED_REVISION || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/ui-scale-prefix/**/*.json
            .ci-results/ui-scale-prefix/**/*.log
            .ci-results/ui-scale-prefix/**/*.oesnapshot
            .ci-results/ui-scale-prefix/**/*.png
            !.ci-results/ui-scale-prefix/**/build/**

  ui-scale-tail:
    if: ${{ !inputs.prefix_only_diagnostic && !inputs.non_ui_cohort_pilot && !inputs.rich_cohort_pilot }}
    name: Rich logical Join, delivery, reopen and navigation
    needs: ui-scale-prefix
    runs-on: windows-latest
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_REVISION: ${{ inputs.revision || github.sha }}
      EXTENDED_OBSERVATION: ${{ inputs.extended_observation || false }}
    steps:
      - name: Start shared execution budget before setup
        run: '"SCALE_STARTED_AT=$([DateTimeOffset]::UtcNow.ToString(''O''))" >> $env:GITHUB_ENV'
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Identify the exact checked-out candidate
        run: |
          $revision = git rev-parse HEAD
          if ($env:CANDIDATE_REVISION -notmatch '^[0-9a-fA-F]{40}$' -or $revision -ne $env:CANDIDATE_REVISION) {
            throw 'Scale verification requires the exact full candidate SHA, not a mutable ref.'
          }
          "TESTED_REVISION=$revision" >> $env:GITHUB_ENV
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extended_observation && 'diagnostic-' || '' }}ui-scale-prefix-${{ env.TESTED_REVISION || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/ui-scale-prefix
      - name: Resume actual validated logical snapshot in a fresh physical store
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path .\eng\Invoke-ScaleWorker.ps1) {
            .\eng\Invoke-ScaleWorker.ps1 -Stage Start -Worker tail -ExpectedRevision $env:TESTED_REVISION -PrefixResultsDirectory .ci-results\ui-scale-prefix -ResultsDirectory .ci-results\ui-scale-tail -ExtendedObservation:([bool]::Parse($env:EXTENDED_OBSERVATION))
          } else {
            .\eng\Run-UiScale.ps1 -ExpectedRevision $env:TESTED_REVISION -Worker tail -PrefixResultsDirectory .ci-results\ui-scale-prefix -ResultsDirectory .ci-results\ui-scale-tail -ExtendedObservation:([bool]::Parse($env:EXTENDED_OBSERVATION))
          }
      - uses: actions/attest@v4
        id: cleanup-attestation
        if: ${{ steps.runner.outputs.needs_cleanup_signature == 'true' }}
        with:
          subject-path: ${{ steps.runner.outputs.cleanup_proof }}
      - name: Observe original tail completion
        if: ${{ steps.runner.outcome == 'success' }}
        env:
          ATTESTATION_BUNDLE: ${{ steps.cleanup-attestation.outputs.bundle-path }}
        run: |
          if (Test-Path .\eng\Invoke-ScaleWorker.ps1) {
            .\eng\Invoke-ScaleWorker.ps1 -Stage Complete -Worker tail -ExpectedRevision $env:TESTED_REVISION -ResultsDirectory .ci-results\ui-scale-tail -AttestationBundle $env:ATTESTATION_BUNDLE
          }
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ inputs.extended_observation && 'diagnostic-' || '' }}ui-scale-tail-${{ env.TESTED_REVISION || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/ui-scale-tail/**/*.json
            .ci-results/ui-scale-tail/**/*.log
            .ci-results/ui-scale-tail/**/*.png
            !.ci-results/ui-scale-tail/**/build/**

  ui-scale:
    name: Complete scale acceptance union
    needs: [non-ui-performance, ui-scale-prefix, ui-scale-tail]
    if: ${{ always() && !inputs.prefix_only_diagnostic && !inputs.non_ui_cohort_pilot && !inputs.rich_cohort_pilot }}
    runs-on: windows-latest
    timeout-minutes: 13
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extended_observation && 'diagnostic-' || '' }}ui-scale-prefix-${{ inputs.revision || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/ui-scale-prefix
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extended_observation && 'diagnostic-' || '' }}ui-scale-tail-${{ inputs.revision || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results/ui-scale-tail
      - name: Require every original scenario and phase in both accepting workers
        if: ${{ always() }}
        env:
          EXPECTED_REVISION: ${{ inputs.revision || github.sha }}
          NON_UI_OUTCOME: ${{ needs.non-ui-performance.result }}
          PREFIX_OUTCOME: ${{ needs.ui-scale-prefix.result }}
          TAIL_OUTCOME: ${{ needs.ui-scale-tail.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          .\eng\Assert-UiScaleUnion.ps1 -PrefixDirectory .ci-results\ui-scale-prefix -TailDirectory .ci-results\ui-scale-tail -ExpectedRevision $env:EXPECTED_REVISION -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT -RequiredJobOutcomes @($env:NON_UI_OUTCOME, $env:PREFIX_OUTCOME, $env:TAIL_OUTCOME)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ inputs.extended_observation && 'diagnostic-' || '' }}ui-scale-${{ inputs.revision || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            .ci-results/ui-scale-union/**/*.json
            .ci-results/ui-scale-union/**/*.log
            .ci-results/ui-scale-union/**/*.oesnapshot
            .ci-results/ui-scale-union/**/*.png
            !.ci-results/ui-scale-union/**/build/**
